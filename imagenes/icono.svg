<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="1" stop-color="#6a5cff"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#22e4ff" stroke-opacity=".35" stroke-width="3"/>

  <!-- base -->
  <rect x="62" y="196" width="104" height="24" rx="8" fill="#1b2644" stroke="#22e4ff" stroke-width="4"/>

  <!-- brazo -->
  <g stroke="url(#arm)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M114 196 L114 124 L172 80"/>
  </g>

  <!-- pinza -->
  <g stroke="#22e4ff" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M172 80 L196 52"/>
    <path d="M172 80 L206 74"/>
  </g>

  <!-- articulaciones -->
  <g fill="#0d1424" stroke="#ff7a2f" stroke-width="7">
    <circle cx="114" cy="196" r="13"/>
    <circle cx="114" cy="124" r="13"/>
    <circle cx="172" cy="80" r="13"/>
  </g>
</svg>
